name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtcl8.6 \
          libsqlite3-0 \
          libsqlite3-dev \
          libc6-dev \
          wget

    - name: Install Buildozer and Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK with Buildozer
      run: |
        echo "=== CONFIGURANDO ENTORNO ==="
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        echo "=== VERIFICANDO buildozer.spec ==="
        ls -la buildozer.spec
        echo ""
        echo "Requisitos configurados:"
        grep "requirements =" buildozer.spec
        
        echo "=== INICIANDO COMPILACIÓN ==="
        # Compilar APK - NO usar buildozer init
        buildozer -v android debug
        
        echo "=== BUSCANDO APK GENERADA ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: Prepare APK for upload
      run: |
        echo "=== PREPARANDO APK PARA UPLOAD ==="
        
        # Buscar APK en todas las ubicaciones posibles
        mkdir -p apk_output
        
        # Patrones de búsqueda
        PATTERNS=(
          "bin/*.apk"
          ".buildozer/android/platform/build-*/*/bin/*.apk"
          ".buildozer/android/platform/app/build/outputs/apk/debug/*.apk"
          ".buildozer/android/platform/build/dists/*/build/outputs/apk/debug/*.apk"
        )
        
        APK_FOUND=false
        
        for pattern in "${PATTERNS[@]}"; do
          for apk in $pattern; do
            if [ -f "$apk" ]; then
              echo "✅ Encontrada: $apk"
              cp "$apk" apk_output/
              APK_FOUND=true
            fi
          done
        done
        
        # Buscar recursivamente si no se encontró
        if [ "$APK_FOUND" = false ]; then
          echo "Buscando APK recursivamente..."
          find . -name "*.apk" -type f -exec cp {} apk_output/ \; 2>/dev/null || true
        fi
        
        # Mostrar lo que hay en apk_output
        echo "Contenido de apk_output/:"
        ls -la apk_output/ || echo "apk_output vacío"
        
        # Si no hay nada, crear archivo dummy para debug
        if [ ! "$(ls -A apk_output/ 2>/dev/null)" ]; then
          echo "⚠️ No se encontró APK, creando archivo de debug"
          echo "APK no generada - Revisar logs de Buildozer" > apk_output/DEBUG_NO_APK.txt
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: apk_output/*
        if-no-files-found: warn

    - name: Show build logs on failure
      if: failure()
      run: |
        echo "=== LOGS DE ERROR ==="
        find .buildozer -name "*.log" -type f | head -5 | while read log; do
          echo "=== $log ==="
          tail -100 "$log"
        done
