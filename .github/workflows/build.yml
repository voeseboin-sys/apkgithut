name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtcl8.6 \
          libsqlite3-0 \
          libsqlite3-dev \
          libc6-dev \
          wget

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK with Buildozer (SIMPLE VERSION)
      run: |
        echo "=== CONFIGURACIÓN SIMPLIFICADA ==="
        
        # Configurar entorno mínimo
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Verificar archivos
        echo "Archivos en el directorio:"
        ls -la
        
        echo "Contenido de buildozer.spec:"
        head -50 buildozer.spec
        
        # Compilar en modo verbose
        echo "=== INICIANDO COMPILACIÓN ==="
        buildozer init
        buildozer -v android debug
        
        echo "=== BUSCANDO ARCHIVOS GENERADOS ==="
        find . -name "*.apk" -type f 2>/dev/null
        find . -name "*.apk" -type f 2>/dev/null | xargs -I {} ls -la {} 2>/dev/null || true
        
        # Verificar directorio bin
        echo "Contenido de bin/:"
        ls -la bin/ 2>/dev/null || echo "Directorio bin/ no existe"
        
        # Verificar directorio .buildozer
        echo "Contenido de .buildozer/android/platform/build-*:"
        find .buildozer -name "*.apk" -type f 2>/dev/null || echo "No hay APKs en .buildozer"

    - name: Find and Upload APK
      run: |
        echo "=== BUSCANDO APK PARA SUBIR ==="
        
        # Buscar APK en múltiples ubicaciones posibles
        APK_PATHS=()
        
        # 1. En bin/ (ubicación estándar)
        if [ -d "bin" ]; then
          APK_PATHS+=(bin/*.apk)
        fi
        
        # 2. En .buildozer/ (ubicación alternativa)
        APK_PATHS+=(.buildozer/android/platform/build-*/*/bin/*.apk)
        
        # 3. Buscar en todo el proyecto
        APK_PATHS+=($(find . -name "*.apk" -type f 2>/dev/null))
        
        echo "Archivos APK encontrados:"
        for apk in "${APK_PATHS[@]}"; do
          if [ -f "$apk" ]; then
            echo "✅ $apk - $(ls -lh "$apk" | awk '{print $5}')"
            # Copiar a ubicación estándar
            mkdir -p bin
            cp "$apk" bin/
          fi
        done
        
        # Mostrar contenido final de bin/
        echo "Contenido final de bin/:"
        ls -la bin/ 2>/dev/null || echo "bin/ vacío o no existe"

    - name: Upload APK (with fallback)
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/*/bin/*.apk
        if-no-files-found: warn

    - name: Debug - List all generated files
      if: always()
      run: |
        echo "=== DEBUG: TODOS LOS ARCHIVOS GENERADOS ==="
        find . -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | xargs -I {} ls -la {} 2>/dev/null || true
        echo "=== DIRECTORIO .buildozer ==="
        find .buildozer -type f -name "*.apk" 2>/dev/null | head -10
