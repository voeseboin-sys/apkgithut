name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ONLY essential system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          wget \
          curl

    - name: Install Buildozer and Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Configure Buildozer to auto-download Android SDK
      run: |
        echo "=== CONFIGURANDO BUILDIOZER ==="
        
        # Asegurar que buildozer.spec tenga configuraciones correctas
        if grep -q "android.sdk_path" buildozer.spec; then
          echo "⚠️ Eliminando android.sdk_path para que Buildozer descargue automáticamente"
          sed -i '/android.sdk_path/d' buildozer.spec
        fi
        
        if grep -q "android.ndk_path" buildozer.spec; then
          echo "⚠️ Eliminando android.ndk_path para que Buildozer descargue automáticamente"
          sed -i '/android.ndk_path/d' buildozer.spec
        fi
        
        # Agregar configuración para auto-descarga si no existe
        if ! grep -q "android.accept_license" buildozer.spec; then
          echo "" >> buildozer.spec
          echo "# Auto-accept Android licenses" >> buildozer.spec
          echo "android.accept_license = True" >> buildozer.spec
        fi
        
        echo "buildozer.spec actualizado:"
        grep -E "(android\\.|requirements)" buildozer.spec

    - name: Build APK with Buildozer (LET IT DOWNLOAD EVERYTHING)
      run: |
        echo "=== BUILDIOZER DESCARGARÁ TODO AUTOMÁTICAMENTE ==="
        
        # Configurar Java
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        echo "JAVA_HOME: $JAVA_HOME"
        
        # Limpiar cache anterior si existe
        rm -rf ~/.buildozer 2>/dev/null || true
        
        # Compilar con tiempo extendido y más verbosidad
        timeout 1800 buildozer -v android debug 2>&1 | tee build.log
        
        # Si falla, mostrar últimos logs
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "=== ÚLTIMAS 100 LÍNEAS DEL LOG ==="
          tail -100 build.log
          
          echo "=== BUSCANDO ERRORES ESPECÍFICOS ==="
          grep -i "error\|fail\|not found\|aidl" build.log | tail -20
        fi

    - name: Find and Prepare APK
      run: |
        echo "=== BUSCANDO APK ==="
        
        # Buscar APK en ubicaciones de Buildozer
        find ~/.buildozer -name "*.apk" -type f 2>/dev/null | while read apk; do
          echo "📦 APK encontrada: $apk"
          mkdir -p bin
          cp "$apk" bin/
        done
        
        # También buscar en directorio actual
        find . -name "*.apk" -type f 2>/dev/null | while read apk; do
          echo "📦 APK local: $apk"
          mkdir -p bin
          cp "$apk" bin/
        done
        
        echo "=== CONTENIDO DE bin/ ==="
        ls -la bin/ 2>/dev/null || echo "bin/ vacío - No se generó APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: bin/*.apk
        if-no-files-found: warn
