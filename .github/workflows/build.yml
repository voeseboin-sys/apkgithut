name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtcl8.6 \
          libsqlite3-0 \
          libsqlite3-dev \
          libc6-dev \
          wget

    - name: Install Android SDK
      run: |
        # Crear directorios
        mkdir -p android-sdk
        cd android-sdk
        
        # Descargar Android Command Line Tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-*.zip
        mkdir -p cmdline-tools
        mv cmdline-tools cmdline-tools/latest
        
        # Configurar entorno
        echo "ANDROID_SDK_ROOT=$(pwd)" >> $GITHUB_ENV
        echo "ANDROID_HOME=$(pwd)" >> $GITHUB_ENV
        echo "$(pwd)/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        # Aceptar licencias
        mkdir -p licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > licenses/android-sdk-preview-license
        
        # Instalar componentes
        yes | ./cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
        ./cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;34.0.0"
        
        # Verificar
        echo "=== Android SDK instalado ==="
        ls -la build-tools/34.0.0/

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK with Buildozer
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: bin/*.apk
