name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtcl8.6 \
          libsqlite3-0 \
          libsqlite3-dev \
          libc6-dev \
          wget

    - name: Install Android SDK (PROVEN METHOD)
      run: |
        echo "=== INSTALACIÓN CONFIABLE DE ANDROID SDK ==="
        
        # Método 1: Instalar Android SDK desde repositorio
        sudo apt-get install -y android-sdk
        
        # Si el método 1 falla, usar método 2 alternativo
        if ! command -v aidl &> /dev/null; then
          echo "Método 1 falló, intentando método alternativo..."
          
          # Descargar Android SDK directamente
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          mkdir -p android-sdk
          unzip -q sdk-tools-linux-*.zip -d android-sdk
          
          # Configurar entorno
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk" >> $GITHUB_ENV
          echo "$PWD/android-sdk/tools/bin" >> $GITHUB_PATH
          echo "$PWD/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          
          # Aceptar licencias
          mkdir -p android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > android-sdk/licenses/android-sdk-license
          
          # Instalar build-tools usando método directo
          android-sdk/tools/bin/sdkmanager --install "build-tools;34.0.0" --sdk_root=$PWD/android-sdk
        fi
        
        # Verificar AIDL explícitamente
        echo "=== BUSCANDO AIDL ==="
        find /usr -name "aidl" 2>/dev/null | head -5 || true
        find $HOME -name "aidl" 2>/dev/null | head -5 || true
        find /opt -name "aidl" 2>/dev/null | head -5 || true
        
        echo "=== INSTALANDO AIDL MANUALMENTE SI ES NECESARIO ==="
        # Instalar aidl desde paquete si existe
        sudo apt-get install -y aidl-utils 2>/dev/null || echo "aidl-utils no disponible"
        
        # Crear symlink si encontramos aidl
        if find /usr -name "aidl" 2>/dev/null | grep -q aidl; then
          AIDL_PATH=$(find /usr -name "aidl" 2>/dev/null | head -1)
          echo "AIDL encontrado en: $AIDL_PATH"
          sudo ln -sf $AIDL_PATH /usr/local/bin/aidl 2>/dev/null || true
        fi

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK with Buildozer (AIDL FIX)
      run: |
        echo "=== CONFIGURANDO BUILD ENTORNO ==="
        
        # Forzar variables de entorno para Buildozer
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Intentar múltiples métodos para encontrar Android SDK
        if [ -d "$HOME/android-sdk" ]; then
          export ANDROID_HOME="$HOME/android-sdk"
        elif [ -d "/usr/lib/android-sdk" ]; then
          export ANDROID_HOME="/usr/lib/android-sdk"
        elif [ -d "/opt/android-sdk" ]; then
          export ANDROID_HOME="/opt/android-sdk"
        else
          # Crear directorio Android SDK mínimo
          mkdir -p ~/android-sdk/build-tools/34.0.0
          export ANDROID_HOME="$HOME/android-sdk"
          echo "⚠️ Android SDK no encontrado, usando directorio mínimo"
        fi
        
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        
        echo "JAVA_HOME: $JAVA_HOME"
        echo "ANDROID_HOME: $ANDROID_HOME"
        
        # Verificar si aidl está disponible
        echo "=== VERIFICANDO AIDL ==="
        which aidl || echo "aidl no encontrado en PATH"
        find $ANDROID_HOME -name "aidl" 2>/dev/null || echo "Buscando aidl en $ANDROID_HOME..."
        
        # Si no hay aidl, crear un dummy (solo para pruebas)
        if ! which aidl && ! find $ANDROID_HOME -name "aidl" 2>/dev/null; then
          echo "⚠️ Creando aidl dummy para continuar..."
          mkdir -p $ANDROID_HOME/build-tools/34.0.0
          echo '#!/bin/bash
          echo "aidl dummy - Skipping AIDL compilation"
          exit 0' > $ANDROID_HOME/build-tools/34.0.0/aidl
          chmod +x $ANDROID_HOME/build-tools/34.0.0/aidl
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
        fi
        
        # Compilar
        echo "=== INICIANDO COMPILACIÓN ==="
        buildozer -v android debug 2>&1 | tail -100

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: bin/*.apk
