name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libtinfo6 \
          ncurses-bin \
          libssl-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtcl8.6 \
          libsqlite3-0 \
          libsqlite3-dev \
          libc6-dev \
          wget

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.36
        pip install buildozer==1.5.0
        pip install -r requirements.txt

    - name: Build APK with Buildozer (NO INIT)
      run: |
        echo "=== CONFIGURACIÓN ==="
        
        # Configurar entorno
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        
        # Verificar que buildozer.spec existe
        echo "Verificando buildozer.spec..."
        if [ -f "buildozer.spec" ]; then
          echo "✅ buildozer.spec encontrado"
          echo "Primeras líneas:"
          head -20 buildozer.spec
        else
          echo "❌ buildozer.spec no encontrado, creando..."
          buildozer init
        fi
        
        # Compilar APK
        echo "=== INICIANDO COMPILACIÓN ==="
        buildozer -v android debug
        
        echo "=== BUSCANDO APK GENERADA ==="
        # Buscar en ubicaciones comunes
        find . -name "*.apk" -type f 2>/dev/null | while read apk; do
          echo "📦 APK encontrada: $apk ($(ls -lh "$apk" | awk '{print $5}'))"
        done || echo "No se encontraron APKs"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/*/bin/*.apk
          .buildozer/android/platform/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Debug - Show all files
      if: always()
      run: |
        echo "=== ARCHIVOS EN EL PROYECTO ==="
        echo "Estructura:"
        ls -la
        
        echo ""
        echo "=== ARCHIVOS .APK ENCONTRADOS ==="
        find . -name "*.apk" -type f 2>/dev/null
        
        echo ""
        echo "=== CONTENIDO DE bin/ ==="
        ls -la bin/ 2>/dev/null || echo "bin/ no existe"
        
        echo ""
        echo "=== CONTENIDO DE .buildozer/ ==="
        find .buildozer -name "*.apk" -type f 2>/dev/null || echo "No hay APKs en .buildozer"
